name: build

# Builds and tests Wintainium and publishes the single-file exe as a build artifact.
# A v* tag also builds the four release files and puts them, with build attestations,
# on a draft release that the maintainer tests before publishing.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Wintainium.sln

      - name: Build
        run: dotnet build Wintainium.sln -c Release --no-restore

      - name: Test
        run: dotnet test Wintainium.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish single-file exe
        run: >
          dotnet publish src/Wintainium.App/Wintainium.App.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - name: Report exe size
        shell: pwsh
        run: |
          $exe = Get-Item publish/Wintainium.exe
          $mb = [math]::Round($exe.Length / 1MB, 1)
          "Wintainium.exe: $mb MB"
          "Wintainium.exe (self-contained, single file): **$mb MB**" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v5
        with:
          name: Wintainium-exe
          path: publish/Wintainium.exe
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dotnet
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $ver = [string]$props.Project.PropertyGroup.Version
          if ("v$ver" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match <Version> $ver in Directory.Build.props." }

      - name: Build the release files
        shell: pwsh
        run: ./build/Build-Release.ps1 -SkipTests

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/Wintainium.exe
            dist/Wintainium-*-portable.zip

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = [array]::FindIndex($lines, [Predicate[string]] { param($l) $l -like "## v$ver*" })
          if ($start -lt 0) { throw "CHANGELOG.md has no section for v$ver." }
          $notes = foreach ($l in $lines[($start + 1)..($lines.Count - 1)]) { if ($l -like '## *') { break }; $l }
          ($notes -join "`n").Trim() | Set-Content dist/notes.md -Encoding utf8

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "Wintainium $ver" --notes-file dist/notes.md `
            dist/Wintainium.exe dist/Wintainium.exe.sha256 "dist/Wintainium-$ver-portable.zip" "dist/Wintainium-$ver-portable.zip.sha256"

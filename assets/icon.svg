      <stop offset="0" stop-color="#2A2A40"/><stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBA6F7"/><stop offset="1" stop-color="#89B4FA"/>
